# Whole stack: MongoDB + ML service + Node API + nginx client.
#   cp .env.example .env     (fill JWT_SECRET and ML_INTERNAL_KEY)
#   docker compose up --build
#   open http://localhost:8080
# For historical analytics put the processed parquet in ./data/processed (see docs/setup-guide.md); without it
# predictions still work and the analytics pages show a clear "unavailable" message.
name: flight-delay

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # not published to the host on purpose: only the server container talks to it

  ml-service:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    restart: unless-stopped
    environment:
      INTERNAL_API_KEY: ${ML_INTERNAL_KEY:?set ML_INTERNAL_KEY in .env (16+ characters)}
      PARQUET_DIR: ../data/processed
      PARQUET_URL: ${PARQUET_URL:-}
      PARQUET_SHA256: ${PARQUET_SHA256:-}
      DUCKDB_MEMORY_LIMIT: ${DUCKDB_MEMORY_LIMIT:-1GB}
    volumes:
      - ./data/processed:/srv/data/processed
    # not published: reachable only from the server container (it is an internal service guarded by X-Internal-Key)
    expose:
      - "8000"

  server:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/flight-delay
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (32+ characters)}
      ML_SERVICE_URL: http://ml-service:8000
      ML_INTERNAL_KEY: ${ML_INTERNAL_KEY:?set ML_INTERNAL_KEY in .env (16+ characters)}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      AVIATIONSTACK_KEY: ${AVIATIONSTACK_KEY:-}
      AVIATIONSTACK_MONTHLY_LIMIT: ${AVIATIONSTACK_MONTHLY_LIMIT:-100}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Flight Delay Predictor <no-reply@example.com>}
    ports:
      - "${SERVER_PORT:-5000}:5000"

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${SERVER_URL:-http://localhost:5000}
    restart: unless-stopped
    depends_on:
      - server
    environment:
      API_ORIGIN: ${SERVER_URL:-http://localhost:5000}
    ports:
      - "${CLIENT_PORT:-8080}:80"

volumes:
  mongo-data:
