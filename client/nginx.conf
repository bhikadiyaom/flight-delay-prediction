# nginx server for the built SPA. This file is a TEMPLATE: ${API_ORIGIN} is substituted at container start.
# NOTE: add_header is deliberately only used at server level (a location that adds its own header drops the inherited
# ones), so caching is done with `expires`, which sets Cache-Control without add_header.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # The one inline script in index.html is the no-flash theme bootstrap, allowed by hash (keep in sync: a client test checks it).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-U+3e8aK5CHBC/G1AJgXx2cxQd62tgEqryHIr4jyI944='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self' ${API_ORIGIN}; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  # hashed build assets never change under the same URL
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # must always be revalidated or users keep an old app shell / old worker forever
  location = /index.html { expires -1; }
  location = /service-worker.js { expires -1; }
  location = /manifest.webmanifest { expires 1h; }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # SPA: every other path is a client-side route (deep links and refresh work)
  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
  }
}
