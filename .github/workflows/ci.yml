name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ml-service:
    name: ML service (pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml-service/requirements.txt
      # runtime requirements + test tools only: torch/jupyter (requirements-dev.txt) are not needed to test serving
      - run: pip install -r requirements.txt pytest==9.1.1 httpx==0.28.1
      # trained artifacts are committed; the 145 MB analytics parquet is not, so those tests skip themselves here
      - run: python -m pytest -q

  server:
    name: Server (lint + tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Cache the mongod binary used by mongodb-memory-server
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongod-${{ runner.os }}-v1
      - run: npm ci
      - run: npm run lint
      # The only external download in the test job is the mongod binary used by mongodb-memory-server. Fetch it first,
      # with retries, so a network blip cannot fail the run (a persistent failure still fails loudly in the next step).
      - name: Pre-download mongod (with retries)
        run: |
          for i in 1 2 3; do
            node -e "import('mongodb-memory-server').then(async ({ MongoMemoryServer }) => { const s = await MongoMemoryServer.create(); await s.stop(); })" && break
            echo "mongod download attempt $i failed, retrying"; sleep 10
          done
      - run: npm test

  client:
    name: Client (lint + tests + build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: https://api.example.com

  docker:
    name: Docker images build
    runs-on: ubuntu-24.04
    needs: [ml-service, server, client]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ml-service (context = repo root)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ml-service/Dockerfile
          push: false
          cache-from: type=gha,scope=ml
          cache-to: type=gha,scope=ml,mode=max
      - name: Build server
        uses: docker/build-push-action@v6
        with:
          context: server
          push: false
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
      - name: Build client
        uses: docker/build-push-action@v6
        with:
          context: client
          push: false
          build-args: VITE_API_URL=https://api.example.com
          cache-from: type=gha,scope=client
          cache-to: type=gha,scope=client,mode=max
      - name: Compose file is valid
        run: |
          printf 'JWT_SECRET=%s\nML_INTERNAL_KEY=%s\n' "$(head -c 24 /dev/urandom | base64)" "$(head -c 16 /dev/urandom | base64)" > .env
          docker compose config --quiet
